name: Validate Command Code Chat

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: command-code-chat-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Java 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Verify workflow contracts
        run: python3 -m unittest discover -s .github/tests -v

      - name: Test, lint, and assemble
        run: ./gradlew :app:testDebugUnitTest :server:test :app:lintDebug :app:assembleDebug :app:verifyComposeDependencyFamily :app:verifyNoServiceUrlConfiguration
