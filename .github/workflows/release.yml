name: Release Command Code Chat
run-name: Release Command Code Chat ${{ inputs.version }} (versionCode ${{ inputs.version_code }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version name already committed to main, for example 1.0.0
        required: true
        type: string
      version_code:
        description: Integer versionCode already committed to main
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: command-code-chat-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      VERSION_CODE: ${{ inputs.version_code }}
      APK_PATH: app/build/outputs/apk/debug/app-debug.apk

    steps:
      - name: Check out release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Require current main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Validate version metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import re

          version = os.environ["VERSION"]
          version_code = os.environ["VERSION_CODE"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit(f"Invalid version: {version!r}")
          if not re.fullmatch(r"[1-9][0-9]*", version_code):
              raise SystemExit(f"Invalid versionCode: {version_code!r}")

          build = pathlib.Path("app/build.gradle.kts").read_text(encoding="utf-8")
          actual_version = re.search(r'^\s*versionName\s*=\s*"([^"]+)"', build, re.MULTILINE)
          actual_code = re.search(r"^\s*versionCode\s*=\s*(\d+)", build, re.MULTILINE)
          if not actual_version or actual_version.group(1) != version:
              raise SystemExit("versionName does not match the workflow input")
          if not actual_code or actual_code.group(1) != version_code:
              raise SystemExit("versionCode does not match the workflow input")
          PY

      - name: Validate release draft
        id: draft
        shell: bash
        env:
          TAG: v${{ inputs.version }}
          RELEASE_TITLE: Command Code Chat ${{ inputs.version }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists" >&2
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" >/dev/null 2>&1; then
            echo "Published release $TAG already exists" >&2
            exit 1
          fi

          draft_ids="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"$TAG\" and .draft == true) | .id"
          )"
          if [ "$(printf '%s\n' "$draft_ids" | sed '/^$/d' | wc -l)" -ne 1 ]; then
            echo "Expected exactly one draft for $TAG" >&2
            exit 1
          fi
          draft_id="$(printf '%s\n' "$draft_ids" | sed '/^$/d')"
          gh api "repos/$GITHUB_REPOSITORY/releases/$draft_id" > "$RUNNER_TEMP/draft.json"

          python3 - <<'PY'
          import json
          import os
          import pathlib

          draft = json.loads(pathlib.Path(os.environ["RUNNER_TEMP"], "draft.json").read_text())
          target = draft["target_commitish"]
          if draft["name"] != os.environ["RELEASE_TITLE"]:
              raise SystemExit("Draft title does not match")
          if draft["tag_name"] != os.environ["TAG"]:
              raise SystemExit("Draft tag does not match")
          if not draft["draft"] or draft["prerelease"]:
              raise SystemExit("Release must be a stable draft")
          if target not in {"main", os.environ["GITHUB_SHA"]}:
              raise SystemExit("Draft target must be main or the checked-out commit")
          if not (draft.get("body") or "").strip():
              raise SystemExit("Draft release notes are empty")
          if draft["assets"]:
              raise SystemExit("Draft must not contain pre-existing assets")
          pathlib.Path(os.environ["RUNNER_TEMP"], "release-body.md").write_text(
              draft["body"], encoding="utf-8"
          )
          PY
          echo "release_id=$draft_id" >> "$GITHUB_OUTPUT"

      - name: Test and build release APK
        shell: bash
        run: |
          python3 -m unittest discover -s .github/tests -v
          ./gradlew :app:testDebugUnitTest :server:test :app:lintDebug :app:assembleDebug :app:verifyComposeDependencyFamily :app:verifyNoServiceUrlConfiguration

      - name: Inspect release APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          test -f "$APK_PATH"
          apk_size="$(stat -c '%s' "$APK_PATH")"
          apk_sha256="$(sha256sum "$APK_PATH" | cut -d' ' -f1)"
          test "$apk_size" -gt 0
          echo "size=$apk_size" >> "$GITHUB_OUTPUT"
          echo "sha256=$apk_sha256" >> "$GITHUB_OUTPUT"
          printf 'CommandCodeChat.apk size: %s bytes\nSHA-256: %s\n' "$apk_size" "$apk_sha256"

      - name: Pin release draft to commit
        shell: bash
        env:
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -f target_commitish="$GITHUB_SHA" \
            > "$RUNNER_TEMP/pinned-draft.json"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq .target_commitish)" = "$GITHUB_SHA"

      - name: Upload CommandCodeChat.apk
        shell: bash
        env:
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            --header "Content-Type: application/vnd.android.package-archive" \
            --data-binary "@$APK_PATH" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=CommandCodeChat.apk" \
            > "$RUNNER_TEMP/asset.json"

      - name: Verify uploaded APK
        shell: bash
        env:
          EXPECTED_SIZE: ${{ steps.apk.outputs.size }}
          EXPECTED_SHA256: ${{ steps.apk.outputs.sha256 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib

          asset = json.loads(pathlib.Path(os.environ["RUNNER_TEMP"], "asset.json").read_text())
          expected = {
              "name": "CommandCodeChat.apk",
              "content_type": "application/vnd.android.package-archive",
              "size": int(os.environ["EXPECTED_SIZE"]),
              "digest": f"sha256:{os.environ['EXPECTED_SHA256']}",
          }
          for field, value in expected.items():
              if asset.get(field) != value:
                  raise SystemExit(f"Asset {field} mismatch: {asset.get(field)!r} != {value!r}")
          if not asset.get("browser_download_url"):
              raise SystemExit("Asset download URL is missing")
          PY

      - name: Create release tag
        shell: bash
        env:
          TAG: v${{ inputs.version }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" \
            -f sha="$GITHUB_SHA"

      - name: Publish release draft
        shell: bash
        env:
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
          TAG: v${{ inputs.version }}
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -f tag_name="$TAG" \
            -F draft=false \
            -F prerelease=false \
            -f make_latest=true \
            > "$RUNNER_TEMP/release.json"

      - name: Verify published release
        shell: bash
        env:
          TAG: v${{ inputs.version }}
          RELEASE_TITLE: Command Code Chat ${{ inputs.version }}
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
          EXPECTED_SIZE: ${{ steps.apk.outputs.size }}
          EXPECTED_SHA256: ${{ steps.apk.outputs.sha256 }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RUNNER_TEMP/release.json"
          python3 - <<'PY'
          import json
          import os
          import pathlib

          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          release = json.loads((temp / "release.json").read_text())
          expected_body = (temp / "release-body.md").read_text(encoding="utf-8")
          if str(release["id"]) != os.environ["RELEASE_ID"]:
              raise SystemExit("Published release ID changed")
          if release["name"] != os.environ["RELEASE_TITLE"]:
              raise SystemExit("Published release title changed")
          if release["tag_name"] != os.environ["TAG"]:
              raise SystemExit("Published release tag changed")
          if release["body"] != expected_body:
              raise SystemExit("Published release notes changed")
          if release["draft"] or release["prerelease"]:
              raise SystemExit("Release was not published as stable")
          if len(release["assets"]) != 1:
              raise SystemExit("Release must contain exactly one supplied asset")
          asset = release["assets"][0]
          expected_asset = {
              "name": "CommandCodeChat.apk",
              "content_type": "application/vnd.android.package-archive",
              "size": int(os.environ["EXPECTED_SIZE"]),
              "digest": f"sha256:{os.environ['EXPECTED_SHA256']}",
          }
          for field, value in expected_asset.items():
              if asset.get(field) != value:
                  raise SystemExit(f"Published asset {field} mismatch")
          print(asset["browser_download_url"])
          PY
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .id)" = "$RELEASE_ID"
          git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
          test "$(git rev-parse "$TAG^{commit}")" = "$GITHUB_SHA"
